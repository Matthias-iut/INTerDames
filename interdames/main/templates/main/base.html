
{% load static %}
<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>INTerDames</title>
    <link rel="stylesheet" href="{% static 'main/style.css' %}">
</head>
<body>
    <header>
        <h1>INTerDames</h1>


        {% if user.is_authenticated %}
            <form method="post" action="/deconnexion/" id="form-deconnexion">
                {% csrf_token %}
                Connecté en tant que {{ user.username }} <button type="submit">Déconnexion</button>
            </form>
        {% endif %}
    </header>

    
    <div class="contenu">
        {% block contenu %}
        {% endblock %}
    </div>

</body>
</html>
