{% extends 'main/base.html' %}

{% block contenu %}
<div class="welcome">Room</div>   

<div hx-ext="ws" ws-connect="/ws/room/{{ partie.token }}/">
    <div class="connection">
        <p id="etat-connexion">Connexion au serveur...</p>
    </div>

    {% include 'main/zone_jeu.html' %}
    {% if not partie.joueur2 %}
    <div hx-get="" hx-trigger="every 2s" hx-target="body" hx-swap="outerHTML"></div>
    {% endif %}
</div>
        

    

<p><a href="/salon/">Retour au salon</a></p>

<script>
function copierLien() {
    var champ = document.getElementById("lien");
    champ.select();
    document.execCommand("copy");
    document.getElementById("copie").innerHTML = "Lien copié !";
}
</script>
{% endblock %}
